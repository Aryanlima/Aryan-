# Configuracion de selene (linter). std "luau+roblox_lite": ver roblox_lite.yml.
std = "luau+roblox_lite"

exclude = ["research/**", ".git/**", "node_modules/**", "tools/.bin/**", "tools/.cache/**"]

[config]
# Los parametros/variables con prefijo _ se permiten sin usar (callbacks de mocks).
unused_variable = { allow_unused_self = true, ignore_pattern = "^_" }
