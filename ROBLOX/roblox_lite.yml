# Libreria estandar "lite" de Roblox para selene.
#
# Motivo: `selene generate-roblox-std` descarga el API dump desde raw.githubusercontent.com,
# que esta bloqueado/no confiable desde el entorno de sesion (ver docs/entorno-y-toolchain.md, en esta misma carpeta ROBLOX/).
# Esto declara los globales de Roblox mas usados como `any` para que selene no marque
# "undefined variable" y siga detectando lo demas (variables sin usar, sombreado, etc.).
# Si en tu maquina con red libre ejecutas `selene generate-roblox-std`, cambia
# `std = "luau+roblox_lite"` por `std = "roblox"` en selene.toml.
---
base: luau
name: roblox_lite
globals:
  # --- Datos y servicios globales ---
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  # --- Libreria de tareas y tiempo ---
  task: { any: true }
  wait: { any: true }
  delay: { any: true }
  spawn: { any: true }
  tick: { any: true }
  time: { any: true }
  elapsedTime: { any: true }
  warn: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
  version: { any: true }
  # --- Tipos de datos ---
  Axes: { any: true }
  BrickColor: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  DateTime: { any: true }
  DockWidgetPluginGuiInfo: { any: true }
  Faces: { any: true }
  FloatCurveKey: { any: true }
  Font: { any: true }
  NumberRange: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  OverlapParams: { any: true }
  PathWaypoint: { any: true }
  PhysicalProperties: { any: true }
  Random: { any: true }
  Ray: { any: true }
  RaycastParams: { any: true }
  Rect: { any: true }
  Region3: { any: true }
  Region3int16: { any: true }
  RotationCurveKey: { any: true }
  SharedTable: { any: true }
  TweenInfo: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Vector2: { any: true }
  Vector2int16: { any: true }
  Vector3: { any: true }
  Vector3int16: { any: true }
  # --- Otras globales de Luau/Roblox ---
  utf8: { any: true }
  buffer: { any: true }
  bit32: { any: true }
  debug: { any: true }
  table: { any: true }
  string: { any: true }
  math: { any: true }
  os: { any: true }
  coroutine: { any: true }
